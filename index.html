<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cao Bồi Săn Thưởng - Simulator</title>
  <style>
    :root {
      --gold: #ffcf40;
      --wood-mid: #4e290d;
      --felt-green: #143627;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at top, #542c12 0%, #140802 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #6e4526 0%, #3a1e0b 65%, var(--felt-green) 65%, #0a1f16 100%);
      border-left: 2px solid #4a2810;
      border-right: 2px solid #4a2810;
      position: relative;
      overflow: hidden;
    }

    /* Thanh chỉnh Tỷ Lệ Scatter & Tốc Độ */
    .admin-bar {
      background: rgba(0, 0, 0, 0.88);
      border-bottom: 1px solid var(--gold);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      z-index: 10;
    }
    .admin-bar label { color: var(--gold); font-weight: bold; white-space: nowrap; }
    .admin-bar input[type="range"] { flex: 1; accent-color: var(--gold); cursor: pointer; }
    .btn-force {
      background: linear-gradient(180deg, #ff512f, #dd2476);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-force.active {
      background: #00e676;
      color: #000;
      box-shadow: 0 0 8px #00e676;
    }

    /* Vòm Hệ Số Nhân (x1 -> x1024) */
    .top-arch {
      margin: 6px 12px 2px;
      background: linear-gradient(180deg, #592e12, #2b1405);
      border: 3px solid #9c632b;
      border-radius: 40px 40px 12px 12px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,200,100,0.3);
    }
    .mult-item {
      font-size: 0.9rem;
      font-weight: 900;
      color: #9e7348;
      transition: all 0.35s ease;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .mult-item.active {
      font-size: 1.35rem;
      color: #fff3b0;
      text-shadow: 0 0 10px #ff8800, 0 2px 2px #000;
      transform: scale(1.18);
    }

    /* Khung Bàn Cờ */
    .board-frame {
      margin: 2px 8px;
      background: linear-gradient(180deg, #42210b 0%, #241004 100%);
      border: 4px solid #784218;
      border-radius: 24px 24px 10px 10px;
      padding: 6px;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.75);
    }
    .ways-header {
      display: flex;
      justify-content: space-between;
      padding: 0 14px 4px;
      font-size: 0.72rem;
      font-weight: 900;
      color: #ffcf70;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px #000;
    }
    .fs-counter-banner {
      display: none;
      text-align: center;
      background: linear-gradient(90deg, transparent, #b31217, transparent);
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 0;
      margin-bottom: 4px;
    }

    /* Lưới 6 Cột 3-4-5-5-4-3 */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      align-items: center;
      background: #170a03;
      border: 2px solid #593010;
      border-radius: 10px;
      padding: 6px 4px;
      min-height: 280px;
      overflow: hidden;
    }
    .reel-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      border-radius: 6px;
      transition: box-shadow 0.3s ease;
    }
    /* Hiệu ứng cột đang quay từ từ */
    .reel-col.spinning-col .symbol-cell {
      animation: reelRoll 0.16s linear infinite;
      filter: blur(1.5px) brightness(0.85);
    }
    /* Hiệu ứng cột phát sáng hồi hộp khi chờ Scatter thứ 3 */
    .reel-col.tease-col {
      box-shadow: 0 0 15px #ffe600, inset 0 0 10px #ff9900;
    }
    @keyframes reelRoll {
      0% { transform: translateY(-18px); }
      50% { transform: translateY(18px); }
      100% { transform: translateY(-18px); }
    }

    .symbol-cell {
      aspect-ratio: 1 / 1.05;
      background: linear-gradient(180deg, #2d1607 0%, #1a0b03 100%);
      border: 1.5px solid #4a260c;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .symbol-cell .icon {
      font-size: 1.45rem;
      line-height: 1;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
    }
    .symbol-cell .tag {
      font-size: 0.5rem;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 3px;
      margin-top: 2px;
    }

    /* Các loại ô đặc biệt */
    .symbol-cell.gold-frame {
      border: 2.5px solid #ffd700;
      background: radial-gradient(circle, #694b08 0%, #2b1d02 100%);
      box-shadow: inset 0 0 8px #ffd700, 0 0 6px rgba(255, 215, 0, 0.6);
    }
    .symbol-cell.gold-frame .tag {
      background: linear-gradient(90deg, #ffd700, #ff9900);
      color: #241000;
    }
    .symbol-cell.wild {
      border: 2px solid #ff3d00;
      background: radial-gradient(circle, #7a1c00 0%, #2b0700 100%);
      box-shadow: 0 0 12px rgba(255, 61, 0, 0.9);
      animation: wildPop 0.4s ease-out;
    }
    .symbol-cell.wild .tag {
      background: linear-gradient(90deg, #ffdf00, #ff4500);
      color: #000;
    }
    @keyframes wildPop {
      0% { transform: scale(0.4); opacity: 0.2; }
      70% { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    .symbol-cell.scatter {
      border: 2px solid #ffe600;
      background: radial-gradient(circle, #8f6800 0%, #2e1f00 100%);
      box-shadow: 0 0 12px rgba(255, 230, 0, 0.9);
    }
    .symbol-cell.scatter .tag {
      background: linear-gradient(90deg, #fff380, #ffae00);
      color: #361900;
    }

    /* Hiệu ứng ăn điểm & nổ chậm rãi */
    .symbol-cell.winning {
      animation: slowWinPulse 0.85s ease-in-out forwards;
      border-color: #fff;
      box-shadow: 0 0 20px #ffd700;
      z-index: 4;
    }
    @keyframes slowWinPulse {
      0% { transform: scale(1); }
      30% { transform: scale(1.18); background: #ffae00; }
      65% { transform: scale(1.12); background: #ff7700; opacity: 1; }
      100% { transform: scale(0.15); opacity: 0; }
    }

    /* Hiệu ứng rơi từ trên xuống từ từ */
    .symbol-cell.drop-in {
      animation: smoothDrop 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes smoothDrop {
      0% { transform: translateY(-45px); opacity: 0; }
      70% { transform: translateY(4px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Nút Mua Tính Năng */
    .buy-feature-btn {
      position: absolute;
      right: -2px;
      bottom: 8px;
      background: linear-gradient(180deg, #6b3510 0%, #381904 100%);
      border: 2px solid #ffcf40;
      border-right: none;
      border-radius: 10px 0 0 10px;
      padding: 5px 10px;
      color: #ffdf80;
      font-weight: 900;
      font-size: 0.72rem;
      text-align: center;
      box-shadow: -3px 3px 10px rgba(0,0,0,0.7);
      cursor: pointer;
      z-index: 5;
      line-height: 1.15;
    }

    /* Thanh Thông Báo Giữa */
    .marquee-box {
      margin: 4px 18px;
      background: linear-gradient(180deg, #3a1c08 0%, #1f0d02 100%);
      border: 2px solid #b57c3c;
      border-radius: 20px;
      padding: 6px 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffe299;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marquee-box.win-highlight {
      background: linear-gradient(90deg, #611404, #b83709, #611404);
      border-color: #ffd700;
      color: #fff;
      font-size: 1rem;
      text-shadow: 0 0 8px #ffd700;
    }

    /* Bàn Điều Khiển Phía Dưới */
    .bottom-panel {
      background: radial-gradient(circle at center, #1b4d38 0%, #092117 100%);
      border-top: 3px solid #6b431e;
      padding: 8px 12px 14px;
    }
    .wallet-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #4d3319;
      border-radius: 20px;
      padding: 5px 10px;
      margin-bottom: 10px;
    }
    .wallet-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #ffd97d;
    }

    .control-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .ctrl-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #8a6432;
      color: #ffd97d;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .ctrl-btn.active {
      background: #ffae00;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 10px #ffae00;
    }
    .spin-revolver {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle, #d48735 0%, #7d4411 65%, #3d1e04 100%);
      border: 4px solid #f5b963;
      box-shadow: 0 0 18px rgba(255, 166, 0, 0.6), inset 0 0 12px #000;
      color: #fff2cc;
      font-size: 1.6rem;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .spin-revolver.spinning {
      animation: rotateCylinder 1.2s linear infinite;
      filter: brightness(1.1);
    }
    @keyframes rotateCylinder {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- Thanh Chỉnh Tỷ Lệ Nổ Scatter -->
  <div class="admin-bar">
    <label for="scatterRange">Tỷ lệ Scatter: <span id="scatterValText">8%</span></label>
    <input type="range" id="scatterRange" min="2" max="40" value="8" oninput="updateScatterRate(this.value)">
    <button class="btn-force" id="forceScatterBtn" onclick="toggleForceScatter()">🎯 Ép nổ 3 Scatter</button>
  </div>

  <!-- Mái Vòm Hệ Số Nhân -->
  <div class="top-arch">
    <div class="mult-item" id="mPrev">x512</div>
    <div class="mult-item active" id="mCurr">X1</div>
    <div class="mult-item" id="mNext1">x2</div>
    <div class="mult-item" id="mNext2">x4</div>
  </div>

  <!-- Khung Bàn Cờ Chính -->
  <div class="board-frame">
    <div class="ways-header">
      <span>3600 ĐƯỜNG</span>
      <span>3600 ĐƯỜNG</span>
    </div>
    <div class="fs-counter-banner" id="fsBanner">
      🔥 VÒNG QUAY MIỄN PHÍ CÒN LẠI: <span id="fsCount">10</span> (NHÂN TỐI THIỂU X8)
    </div>

    <div class="reels-grid" id="reelsGrid"></div>

    <div class="buy-feature-btn" onclick="buyFreeSpins()">
      TÍNH NĂNG<br>MUA
    </div>
  </div>

  <!-- Thanh Thông Báo Giữa -->
  <div class="marquee-box" id="marqueeBox">
    Bấm nút Quay để bắt đầu!
  </div>

  <!-- Bàn Điều Khiển Phía Dưới -->
  <div class="bottom-panel">
    <div class="wallet-bar">
      <div class="wallet-item">💼 đ<span id="balText">100.00</span></div>
      <div class="wallet-item">🏆 đ<span id="winText">0.00</span></div>
      <div class="wallet-item">🪙 đ<span id="betText">2.00</span></div>
    </div>

    <div class="control-row">
      <button class="ctrl-btn" id="turboBtn" onclick="toggleTurbo()" title="Chế độ Nhanh/Chậm">⚡</button>
      <button class="ctrl-btn" onclick="adjustBet(-1)">−</button>
      <button class="spin-revolver" id="spinBtn" onclick="spin()">↻</button>
      <button class="ctrl-btn" onclick="adjustBet(1)">+</button>
      <button class="ctrl-btn" id="autoBtn" onclick="toggleAuto()" style="font-size: 0.72rem;">AUTO</button>
    </div>
  </div>
</div>

<script>
  const COL_HEIGHTS = [3, 4, 5, 5, 4, 3];
  const BET_OPTIONS = [0.40, 1.00, 2.00, 5.00, 10.00, 20.00, 50.00];

  const SYMBOLS = [
    { id: 'BANDIT',  icon: '🤠', pay: 2.5, weight: 9 },
    { id: 'GUN',     icon: '🔫', pay: 1.5, weight: 12 },
    { id: 'HAT',     icon: '🎩', pay: 1.0, weight: 15 },
    { id: 'WHISKEY', icon: '🥃', pay: 0.8, weight: 18 },
    { id: 'A',       icon: '🅰️', pay: 0.5, weight: 24 },
    { id: 'K',       icon: '🅺', pay: 0.4, weight: 26 },
    { id: 'Q',       icon: '🆀', pay: 0.3, weight: 28 },
    { id: 'J',       icon: '🅹', pay: 0.2, weight: 30 },
    { id: 'WILD',    icon: '🤠', pay: 0,   weight: 4 }
  ];

  let balance = 100.00;
  let betIdx = 2;
  let roundWin = 0.00;
  let currentMult = 1;
  let scatterProb = 0.08;
  let forceNextScatter = false;
  let freeSpinsLeft = 0;
  let isSpinning = false;
  let isTurbo = false;
  let isAuto = false;
  let board = [];
  // Mảng lưu trạng thái cột nào đang quay
  let spinningCols = [false, false, false, false, false, false];
  let teaseCols = [false, false, false, false, false, false];

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, duration, type = 'sine') {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function updateScatterRate(val) {
    scatterProb = parseInt(val, 10) / 100;
    document.getElementById('scatterValText').textContent = val + '%';
  }

  function toggleForceScatter() {
    forceNextScatter = !forceNextScatter;
    document.getElementById('forceScatterBtn').classList.toggle('active', forceNextScatter);
  }

  function createRandomCell(colIdx, allowScatter = true) {
    if (allowScatter && Math.random() < scatterProb) {
      return { id: 'SCATTER', icon: '🪙', pay: 0, isGold: false, explode: false, isNew: true };
    }
    const totalW = SYMBOLS.reduce((sum, s) => sum + s.weight, 0);
    let r = Math.random() * totalW;
    let chosen = SYMBOLS[0];
    for (const s of SYMBOLS) {
      if (r < s.weight) { chosen = s; break; }
      r -= s.weight;
    }
    const canGold = colIdx >= 1 && colIdx <= 4 && chosen.id !== 'WILD';
    const isGold = canGold && Math.random() < 0.25;
    return { ...chosen, isGold, explode: false, isNew: true };
  }

  function prepareBoardData() {
    board = COL_HEIGHTS.map((h, cIdx) => {
      const col = [];
      for (let r = 0; r < h; r++) {
        const hasScatterInCol = col.some(item => item.id === 'SCATTER');
        col.push(createRandomCell(cIdx, !hasScatterInCol));
      }
      return col;
    });

    if (forceNextScatter) {
      const cols = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5).slice(0, 3);
      cols.forEach(c => {
        board[c].forEach(cell => { if (cell.id === 'SCATTER') Object.assign(cell, SYMBOLS[4]); });
        const randRow = Math.floor(Math.random() * COL_HEIGHTS[c]);
        board[c][randRow] = { id: 'SCATTER', icon: '🪙', pay: 0, isGold: false, explode: false, isNew: true };
      });
      forceNextScatter = false;
      document.getElementById('forceScatterBtn').classList.remove('active');
    }
  }

  function renderBoard() {
    const gridEl = document.getElementById('reelsGrid');
    gridEl.innerHTML = '';

    board.forEach((col, cIdx) => {
      const colEl = document.createElement('div');
      let colCls = 'reel-col';
      if (spinningCols[cIdx]) colCls += ' spinning-col';
      if (teaseCols[cIdx]) colCls += ' tease-col';
      colEl.className = colCls;

      col.forEach(cell => {
        const el = document.createElement('div');
        let cls = 'symbol-cell';

        // Nếu cột đang quay thì hiện biểu tượng ngẫu nhiên mờ để tạo cảm giác cuộn
        if (spinningCols[cIdx]) {
          const fakeSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          el.className = cls;
          el.innerHTML = `<div class="icon">${fakeSym.icon}</div>`;
        } else {
          if (cell.isGold) cls += ' gold-frame';
          if (cell.id === 'WILD') cls += ' wild';
          if (cell.id === 'SCATTER') cls += ' scatter';
          if (cell.explode) cls += ' winning';
          if (cell.isNew) cls += ' drop-in';
          el.className = cls;

          let tagHTML = '';
          if (cell.id === 'WILD') tagHTML = '<span class="tag">WILD</span>';
          else if (cell.id === 'SCATTER') tagHTML = '<span class="tag">SCATTER</span>';
          else if (cell.isGold) tagHTML = '<span class="tag">KHUNG VÀNG</span>';

          el.innerHTML = `<div class="icon">${cell.icon}</div>${tagHTML}`;
          cell.isNew = false;
        }
        colEl.appendChild(el);
      });
      gridEl.appendChild(colEl);
    });
  }

  function updateArchUI(m) {
    const prev = m === 1 ? 1024 : m / 2;
    const next1 = m >= 1024 ? 1024 : m * 2;
    const next2 = next1 >= 1024 ? 1024 : next1 * 2;
    document.getElementById('mPrev').textContent = 'x' + prev;
    document.getElementById('mCurr').textContent = 'X' + m;
    document.getElementById('mNext1').textContent = 'x' + next1;
    document.getElementById('mNext2').textContent = 'x' + next2;
  }

  function updateWalletUI() {
    document.getElementById('balText').textContent = balance.toFixed(2);
    document.getElementById('winText').textContent = roundWin.toFixed(2);
    document.getElementById('betText').textContent = BET_OPTIONS[betIdx].toFixed(2);

    const fsBanner = document.getElementById('fsBanner');
    if (freeSpinsLeft > 0) {
      fsBanner.style.display = 'block';
      document.getElementById('fsCount').textContent = freeSpinsLeft;
    } else {
      fsBanner.style.display = 'none';
    }
  }

  function setMarquee(text, isWin = false) {
    const box = document.getElementById('marqueeBox');
    box.textContent = text;
    box.classList.toggle('win-highlight', isWin);
  }

  function checkWins() {
    let baseWin = 0;
    let foundWin = false;
    const paySymbols = SYMBOLS.filter(s => s.id !== 'WILD');

    paySymbols.forEach(sym => {
      let matchedCols = 0;
      let ways = 1;

      for (let c = 0; c < 6; c++) {
        const count = board[c].filter(cell => cell.id === sym.id || cell.id === 'WILD').length;
        if (count > 0) {
          matchedCols++;
          ways *= count;
        } else {
          break;
        }
      }

      if (matchedCols >= 3) {
        foundWin = true;
        const colMult = matchedCols === 3 ? 1 : matchedCols === 4 ? 2 : matchedCols === 5 ? 3 : 5;
        baseWin += BET_OPTIONS[betIdx] * 0.05 * sym.pay * colMult * ways;

        for (let c = 0; c < matchedCols; c++) {
          board[c].forEach(cell => {
            if (cell.id === sym.id || cell.id === 'WILD') cell.explode = true;
          });
        }
      }
    });

    return { foundWin, baseWin };
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function spin() {
    if (isSpinning) return;
    const bet = BET_OPTIONS[betIdx];

    if (freeSpinsLeft === 0 && balance < bet) {
      setMarquee('⚠️ Số dư không đủ, hãy giảm mức cược!');
      isAuto = false;
      document.getElementById('autoBtn').classList.remove('active');
      return;
    }

    isSpinning = true;
    const spinBtn = document.getElementById('spinBtn');
    spinBtn.classList.add('spinning');

    if (freeSpinsLeft > 0) {
      freeSpinsLeft--;
      currentMult = 8;
    } else {
      balance -= bet;
      roundWin = 0;
      currentMult = 1;
    }

    updateArchUI(currentMult);
    updateWalletUI();
    setMarquee('Đang quay...', false);

    // Chuẩn bị dữ liệu kết quả và bắt đầu cho cả 6 cột quay
    prepareBoardData();
    spinningCols = [true, true, true, true, true, true];
    teaseCols = [false, false, false, false, false, false];
    renderBoard();

    // Thời gian khởi động cuộn quay ban đầu
    await wait(isTurbo ? 200 : 500);

    // Dừng lần lượt từng cột từ trái sang phải (Cột 1 -> Cột 6)
    let landedScatters = 0;
    for (let c = 0; c < 6; c++) {
      // Nếu đã có 2 Scatter trên bàn, làm chậm cột tiếp theo để hồi hộp
      if (landedScatters >= 2 && !isTurbo) {
        teaseCols[c] = true;
        renderBoard();
        setMarquee('🔥 Đang chờ biểu tượng Scatter thứ 3...', true);
        playTone(520, 0.35, 'sawtooth');
        await wait(900); // Quay chậm hồi hộp 0.9 giây
      } else {
        await wait(isTurbo ? 120 : 380); // Mỗi cột dừng cách nhau 0.38 giây
      }

      spinningCols[c] = false;
      teaseCols[c] = false;

      // Kiểm tra cột vừa dừng có Scatter không
      const hasScat = board[c].some(cell => cell.id === 'SCATTER');
      if (hasScat) {
        landedScatters++;
        playTone(700 + landedScatters * 120, 0.25, 'triangle');
      } else {
        playTone(180 + c * 25, 0.1, 'sine'); // Tiếng "cạch" khi dừng cột
      }

      renderBoard();
    }

    // Nghỉ một nhịp sau khi cả 6 cột đã dừng hẳn để người chơi nhìn bàn cờ
    await wait(isTurbo ? 250 : 600);

    // Vòng lặp xét thưởng và nổ dây chuyền từ từ
    let step = 0;
    while (true) {
      const { foundWin, baseWin } = checkWins();
      if (!foundWin) break;

      step++;
      const winAmount = +(baseWin * currentMult).toFixed(2);
      roundWin = +(roundWin + winAmount).toFixed(2);
      balance = +(balance + winAmount).toFixed(2);

      playTone(400 + step * 90, 0.35, 'sine');
      renderBoard();
      updateWalletUI();
      setMarquee(`💥 NỔ NHỊP ${step}: +${winAmount.toFixed(2)} (Nhân X${currentMult})`, true);

      // Chờ 0.95 giây để nhìn rõ các ô đang phát sáng ăn điểm
      await wait(isTurbo ? 400 : 950);

      // Biến Khung Vàng thành WILD và làm rơi các ô mới xuống
      for (let c = 0; c < 6; c++) {
        const survivors = [];
        board[c].forEach(cell => {
          if (cell.explode) {
            if (cell.isGold) {
              survivors.push({ id: 'WILD', icon: '🤠', pay: 0, isGold: false, explode: false, isNew: true });
            }
          } else {
            survivors.push(cell);
          }
        });

        const needed = COL_HEIGHTS[c] - survivors.length;
        const fresh = [];
        for (let i = 0; i < needed; i++) {
          const hasScat = survivors.some(s => s.id === 'SCATTER') || fresh.some(s => s.id === 'SCATTER');
          fresh.push(createRandomCell(c, !hasScat));
        }
        board[c] = [...fresh, ...survivors];
      }

      currentMult = Math.min(1024, currentMult * 2);
      updateArchUI(currentMult);
      playTone(300, 0.18, 'triangle');
      renderBoard();

      // Chờ 0.8 giây cho hiệu ứng rơi biểu tượng mới hoàn tất rồi mới xét nhịp tiếp theo
      await wait(isTurbo ? 350 : 800);
    }

    // Kiểm tra tổng số Scatter sau khi dừng hết nhịp nổ
    let scatterTotal = 0;
    board.forEach(col => col.forEach(cell => { if (cell.id === 'SCATTER') scatterTotal++; }));

    if (scatterTotal >= 3) {
      const wonSpins = 10 + (scatterTotal - 3) * 2;
      freeSpinsLeft += wonSpins;
      playTone(880, 0.6, 'square');
      setMarquee(`🎉 NỔ ${scatterTotal} SCATTER! +${wonSpins} VÒNG MIỄN PHÍ (X8)`, true);
      updateWalletUI();
      await wait(1800);
    } else if (step > 0) {
      setMarquee(`🏆 TỔNG THẮNG: đ${roundWin.toFixed(2)}`, true);
    } else {
      setMarquee('3 biểu tượng Scatter sẽ kích hoạt 10 vòng quay miễn phí', false);
    }

    spinBtn.classList.remove('spinning');
    isSpinning = false;

    if (isAuto || freeSpinsLeft > 0) {
      await wait(isTurbo ? 400 : 1000);
      if (isAuto || freeSpinsLeft > 0) spin();
    }
  }

  function buyFreeSpins() {
    if (isSpinning || freeSpinsLeft > 0) return;
    const cost = +(BET_OPTIONS[betIdx] * 10).toFixed(2);
    if (balance < cost) {
      setMarquee(`⚠️ Cần đ${cost.toFixed(2)} để Mua Tính Năng!`);
      return;
    }
    balance = +(balance - cost).toFixed(2);
    roundWin = 0;
    forceNextScatter = true;
    updateWalletUI();
    setMarquee('🔥 ĐÃ MUA TÍNH NĂNG! ĐANG QUAY TỪ TỪ RA 3 SCATTER...', true);
    spin();
  }

  function adjustBet(dir) {
    if (isSpinning || freeSpinsLeft > 0) return;
    betIdx = Math.max(0, Math.min(BET_OPTIONS.length - 1, betIdx + dir));
    updateWalletUI();
  }

  function toggleTurbo() {
    isTurbo = !isTurbo;
    document.getElementById('turboBtn').classList.toggle('active', isTurbo);
  }

  function toggleAuto() {
    isAuto = !isAuto;
    document.getElementById('autoBtn').classList.toggle('active', isAuto);
    if (isAuto && !isSpinning) spin();
  }

  prepareBoardData();
  renderBoard();
  updateWalletUI();
</script>
</body>
